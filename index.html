<style id="darkroom-motion">
.home-page .cover-text h1,.home-page .section-heading h2 { text-shadow:0 -1px #0009,0 1px 1px #eee2; }

  .home-page .cover-text h1 { animation:darkroom-title 2400ms ease-out both; }
  .home-page .cover-text .eyebrow { animation:darkroom-print 1800ms ease-out 180ms both; }
  .home-page .cover-photo img { animation:darkroom-breath 5s cubic-bezier(.22,.61,.36,1) both; }
  .home-page .photo-exposed img {
    animation:darkroom-develop 1450ms ease-out both;
  }
  @media(hover:hover){
    .home-page .team-photo img { transition:filter 420ms ease; }
    .home-page .team-photo:hover img { filter:brightness(1.045) contrast(1.015); }
  }
  .home-page :is(button,a):active { box-shadow:inset 0 1px #ffffff88; }
}

@keyframes darkroom-print { from{opacity:.55;transform:translateX(3px)} to{opacity:1;transform:none} }
@keyframes darkroom-breath { 0%{opacity:.23;filter:brightness(.52)} 52%{opacity:.82;filter:brightness(.88)} 100%{opacity:1;filter:none} }
@keyframes darkroom-develop {
  0%{filter:grayscale(.52) brightness(.42) contrast(.75) blur(2px)}
  78%{filter:grayscale(.08) brightness(.93) contrast(.96) blur(.55px)}
  100%{filter:none}
}

function replayScheduleChange(redo){

 if(change.some(entry=>JSON.stringify(current.get(entry.id))!==JSON.stringify(entry[expected]))){
  alert('这次操作涉及的安排已有更新，请核对后手动修改。');return;

 for(const entry of change){
  if(entry[result])current.set(entry.id,entry[result]);else current.delete(entry.id);
 }

  rememberDraftRows();
  lastScheduleChange=redo?change:undefined;
  lastUndoneScheduleChange=redo?undefined:change;

function labelledLines(text){

 }).filter(([label])=>label);
}

function taskError(t){

  if(!t.delivery)return '填写追加验收记录前，请填写首次交付时间。';

async function readRestXlsx(buffer){

  offset+=46+length+view.getUint16(offset+30,true)+view.getUint16(offset+32,true);

  const data=bytes.subarray(start,start+entry.size);

   const perSum=Object.values(memberShotCounts).reduce((s,o)=>s+Object.values(o).reduce((a,b)=>a+b,0),0);

function renderOutputChart(rows,ranges,estimateOctober,note){
 const chart=document.querySelector('#outputChart');
 const periods=['日产出','周产出','月产出'];
 const estimated=estimateOctober&&chartPeriod<2;
 const [from,to]=ranges[estimated?2:chartPeriod];
 const entries=tasks.filter(t=>t.date>=from&&t.date<=to);
 const values=rows.map(row=>[row[0],row[1],row[chartPeriod+2]])
  .filter(([name,,value])=>typeof value==='number'||entries.some(t=>participates(t,name)))
  .sort((a,b)=>(typeof b[2]==='number'?b[2]:-1)-(typeof a[2]==='number'?a[2]:-1));
 const groups=['拍摄组','模特组','创新组','其他岗位'];
 chart.innerHTML='<div class="chart-switch" role="group" aria-label="图表统计周期">'+periods.map((label,index)=>'<button type="button" data-chart-period="'+index+'" aria-pressed="'+(index===chartPeriod)+'">'+label+'</button>').join('')+'</div>'+
 '<p class="chart-caption">'+esc(estimated?note+' 姓名明细展示整月任务。':'点击姓名查看任务类型和协作情况。条形长度按组内最高值计算。')+'</p>'+
 groups.map(group=>{
  const people=values.filter(([,role])=>outputGroup(role)===group);
  if(group==='其他岗位'&&!people.length)return '';
  const max=Math.max(1,...people.map(([, ,value])=>typeof value==='number'?value:0));
  return '<section class="chart-group"><h3>'+group+'</h3>'+
   (people.length?'<ul class="chart-list">'+people.map(([name,,value])=>{
    const hasValue=typeof value==='number';
    return '<li><details class="chart-person"><summary class="chart-row"><strong>'+esc(name)+'</strong>'+
     '<div class="chart-track" aria-hidden="true"><div class="chart-bar" style="width:'+(hasValue?100*value/max:0)+'%"></div></div>'+
     '<span class="chart-value">'+(hasValue?(estimated?'约 ':'')+count(value)+' 条':'待记录')+'</span></summary>'+
     '<div class="chart-person-detail">'+outputBreakdown(name,entries)+'</div></details></li>';
   }).join('')+'</ul>':'<p class="empty">所选周期暂无产出或任务记录。</p>')+'</section>';
 }).join('');
 chart.querySelectorAll('[data-chart-period]').forEach(button=>button.onclick=()=>{
  chartPeriod=Number(button.dataset.chartPeriod);
  renderOutputChart(rows,ranges,estimateOctober,note);
  chart.querySelector('[aria-pressed="true"]')?.focus();
 });
}

function shootingComplete(task){
 if(task.shootingCompletion==='incomplete')return false;
 if(task.shootingCompletion==='complete')return true;
 if(Number(task.target)>0&&task.actual!=null&&task.actual!=='')return Number(task.actual)>=Number(task.target);

}

async function compressSharedImage(file){
 if(!/^image\/(jpeg|png|webp)$/i.test(file.type))throw Error('仅支持 JPG、PNG 或 WebP 图片。');
 if(file.size>12*1024*1024)throw Error('单张原图请控制在 12 MB 以内。');
 const bitmap=await createImageBitmap(file);
 let longest=Math.max(bitmap.width,bitmap.height);
 let scale=Math.min(1,1600/longest);
 for(const quality of [.84,.76,.68]){
  const width=Math.max(1,Math.round(bitmap.width*scale));
  const height=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  canvas.getContext('2d').drawImage(bitmap,0,0,width,height);
  const src=canvas.toDataURL('image/webp',quality);
  if(src.length<=650000){bitmap.close?.();return {src,caption:file.name.replace(/\.[^.]+$/,'')};}
  scale*=.8;
 }
 bitmap.close?.();throw Error('图片压缩后仍过大，请换一张更小的图片。');
}

 document.querySelector('#adminForm').onsubmit=async e=>{
  e.preventDefault();
  const form=e.currentTarget;
  const fields=new FormData(form);
  const status=document.querySelector('#adminStatus');
  const lines=value=>[...new Set(String(value||'').split(/\r?\n/).map(item=>item.trim()).filter(Boolean))];
  const next={...settings};
  for(const [key,value] of fields)if(typeof value==='string'&&Object.hasOwn(defaults,key)&&!['photo','products','types','gallery'].includes(key))next[key]=value.trim();
  const safeImage=src=>/^https:\/\/[^\s]+$/i.test(src)||/^\.\/[\w./%-]+$/i.test(src)||/^data:image\/(jpeg|png|webp);base64,/i.test(src);
  next.gallery=String(fields.get('gallery')||'').split(/\r?\n/).filter(line=>line.trim()).map(line=>{
   const [src,...caption]=line.split('|');
   return {src:src.trim(),caption:caption.join('|').trim()};
  });
  const artworkFiles=fields.getAll('artworkUpload').filter(file=>file?.size);
  const galleryFiles=fields.getAll('galleryUpload').filter(file=>file?.size);
  try{
   const [newArtwork,newGallery]=await Promise.all([
    Promise.all(artworkFiles.map(compressSharedImage)),
    Promise.all(galleryFiles.map(compressSharedImage))
   ]);
   if(newArtwork.length)next.artwork=[...lines(next.artwork),...newArtwork.map(item=>item.src)].join('\n');
   if(newGallery.length)next.gallery.push(...newGallery);
  }catch(error){status.textContent=error.message||'图片读取失败，请重新选择。';return}
  if(next.gallery.some(p=>!safeImage(p.src))||next.artwork.split(/\r?\n/).some(src=>src.trim()&&!safeImage(src.trim()))){
   status.textContent='配图和相册地址请填写 HTTPS 地址或以 ./ 开头的站内路径。';return;
  }
  next.products=lines(fields.get('products'));
  next.types=lines(fields.get('types'));
  next.specialOptions=lines(fields.get('specialOptions'));
  next.roster=Object.create(null);
  for(const role of Object.keys(defaultRoster))next.roster[role]=[];
  next.inactiveStaff=[];
  for(const row of rosterRows.rows){
   const name=row.querySelector('[name="staffName"]').value.trim();
   const role=row.querySelector('[name="staffRole"]').value||row.querySelector('[name="customStaffRole"]').value.trim();
   if(!name||!role||Object.hasOwn(Object.prototype,role)){
    status.textContent='请填写有效的姓名和岗位。';return;
   }
   (next.roster[role]??=[]).push(name);
   if(row.querySelector('[name="staffStatus"]').value==='离职')next.inactiveStaff.push(name);
  }
  const names=Object.values(next.roster).flat();
  if(!next.title||!next.homeTitle||!next.leader||!next.opsLead||!next.products.length||!next.types.length){status.textContent='请填写网站名称、首页标题、负责人，并保留至少一个品类和拍摄类型。';return}
  if(new Set(names).size!==names.length){status.textContent='同一姓名请只填写在一个岗位名单中。';return}
  const photo=fields.get('photoUpload');
  if(fields.has('resetPhoto'))next.photo='';
  if(photo?.size){
   if(photo.size>2*1024*1024||!/^image\/(jpeg|png|webp)$/.test(photo.type)){status.textContent='请上传 2 MB 以内的 JPG、PNG 或 WebP 图片。';return}
