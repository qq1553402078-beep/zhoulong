let lastScheduleChange;
function save(next,recordUndo=true){
 try{
  if(recordUndo){
   const before=new Map(tasks.map(task=>[task.id,task]));
   const after=new Map(next.map(task=>[task.id,task]));
   const changed=[...new Set([...before.keys(),...after.keys()])].filter(id=>JSON.stringify(before.get(id))!==JSON.stringify(after.get(id)));
   localStorage.setItem(key,JSON.stringify(next));
   if(changed.length)lastScheduleChange=changed.map(id=>({id,before:before.get(id),after:after.get(id)}));
  }else localStorage.setItem(key,JSON.stringify(next));
  tasks=next;return true;
 }catch{alert('无法保存到浏览器，请检查存储权限或空间。');return false}
}
function undoSchedule(){
 if(!lastScheduleChange)return;
 const current=new Map(tasks.map(task=>[task.id,task]));
 if(lastScheduleChange.some(({id,after})=>JSON.stringify(current.get(id))!==JSON.stringify(after))){
  alert('这次操作涉及的安排已有更新，请核对后手动修改。');return;
 }
 if(!confirm('撤销上一次已保存的工作安排修改？'))return;
 for(const {id,before} of lastScheduleChange){
  if(before)current.set(id,before);else current.delete(id);
 }
 if(save([...current.values()],false)){
  rememberDraftRows();
  lastScheduleChange=undefined;savedTask=null;render();
  document.querySelector('#scheduleSaved [role="status"]').textContent='已撤销上次修改。';
 }
}

  if(!t.delivery)return '填写追加验收记录前，请填写首次交付时间。';
  if(![...roles,'handModel'].some(role=>t[role]))return '请分配验收记录对应的参与人员。';

 }

 if(statuses.slice(3).includes(t.status)&&!t.delivery)return '请展开「工单与交付」，填写首次交付时间。';

function parseDelimited(text){

 const source=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n')+'\n';
 for(let i=0;i<source.length;i++){
  const char=source[i];
  if(char==='"'){
   if(quoted&&source[i+1]==='"'){cell+='"';i++}else quoted=!quoted;
  }else if(!quoted&&(char===separator||char==='\n')){
   rows.at(-1).push(cell);cell='';
   if(char==='\n')rows.push([]);
  }else cell+=char;
 }
 return rows;
}

 if(!match)return '';
 const date=match[1]+'-'+match[2].padStart(2,'0')+'-'+match[3].padStart(2,'0');

 return Number.isFinite(stamp)&&new Date(stamp).toISOString().slice(0,10)===date?date:'';

async function readRestXlsx(buffer){
 const bytes=new Uint8Array(buffer), view=new DataView(buffer), decoder=new TextDecoder();

 for(;end>=Math.max(0,bytes.length-65557);end--)if(view.getUint32(end,true)===0x06054b50)break;

 let offset=view.getUint32(end+16,true);

 for(let i=0;i<view.getUint16(end+10,true);i++){
  const length=view.getUint16(offset+28,true);
  const name=decoder.decode(bytes.subarray(offset+46,offset+46+length));
  entries.set(name,{size:view.getUint32(offset+20,true),method:view.getUint16(offset+10,true),start:view.getUint32(offset+42,true)});
  offset+=46+length+view.getUint16(offset+30,true)+view.getUint16(offset+32,true);
 }
 async function xml(name){
  const entry=entries.get(name);
  if(!entry)return null;
  const start=entry.start+30+view.getUint16(entry.start+26,true)+view.getUint16(entry.start+28,true);
  const data=bytes.subarray(start,start+entry.size);
  const text=entry.method===0?decoder.decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return new DOMParser().parseFromString(text,'application/xml');
 }

    const value=cell.getElementsByTagName('v')[0]?.textContent||'';
    const kind=cell.getAttribute('t');
    values[col]=kind==='s'?strings[Number(value)]:kind==='inlineStr'?[...cell.getElementsByTagName('t')].map(t=>t.textContent).join(''):value;
   }
   return values;
  });
  if(rows.some(row=>row.some(v=>String(v).trim()==='姓名')&&row.some(restDate)))return rows;
 }
 throw Error('工作簿中没有找到含「姓名」和日期的排班表。');
}

 chart.innerHTML='<div class="chart-switch" role="group" aria-label="图表统计周期">'+periods.map((label,index)=>'<button type="button" data-chart-period="'+index+'" aria-pressed="'+(index===chartPeriod)+'">'+label+'</button>').join('')+'</div>'+
 (values.length?'<ul class="chart-list" aria-label="'+periods[chartPeriod]+'">'+values.map(([name,value])=>'<li class="chart-row"><strong>'+esc(name)+'</strong><div class="chart-track" aria-hidden="true"><div class="chart-bar" style="width:'+100*value/max+'%"></div></div><span class="chart-value">'+count(value)+' 条</span></li>').join('')+'</ul><div class="chart-caption">按已记录产出从高到低排列。完整名册见下表。</div>':'<p class="empty">所选周期暂无产出记录。填写当天条数后，图表会自动更新。</p>');
 chart.querySelectorAll?.('[data-chart-period]').forEach(button=>button.onclick=()=>{

  chart.querySelector('[aria-pressed="true"]')?.focus();
 });
}

 panel('导航与页面文案',copyFields([
  ['navHome','首页导航'],['navSchedule','工作安排导航'],['navRest','休息表导航'],['navPeople','人效导航'],['navPlan','产能规划导航'],['navAdmin','后台导航'],
  ['brandLine','首页英文署名'],['brandSubtitle','首页副标'],['scheduleButton','排班按钮'],['peopleButton','人效按钮'],
  ['productsTitle','品类标题'],['shootingTitle','拍摄类型标题'],['deliveryTitle','交付标题'],['orgTitle','组织架构标题'],
  ['scheduleTitle','排班标题'],['restTitle','休息表标题'],['peopleTitle','人效看板标题'],['footerBrand','页脚署名'],['footerText','页脚说明']
 ])+field('scheduleIntro','排班页介绍','area'))+
 panel('拍摄配图与团队相册',field('artCaption','拍摄配图说明')+
 field('artwork','拍摄配图地址（按类型介绍顺序，每行一张）','area',settings.artwork||artworkDefaults.join('\n'))+
 field('galleryTitle','相册标题')+field('galleryIntro','相册介绍','area')+
 field('gallery','相册（每行填写 图片地址 | 说明，可删除或调整顺序）','area',getTeamPhotos().map(p=>p.src+' | '+p.caption).join('\n'))+
 '<p class="wide">图片可用 HTTPS 地址，或站内相对路径。清空相册内容可隐藏相册。</p>')+
 panel('业务数据','<div class="bar wide"><button type="button" data-admin-route="schedule">编辑任务与交付</button><button type="button" data-admin-route="rest">编辑出勤与调休</button><button type="button" data-admin-route="people">编辑产出与目标</button></div>')+
 panel('组织架构与人员',field('leader','部门负责人')+field('specialty','专项分工','area')+
 Object.keys(defaultRoster).map(role=>field('roster:'+role,role+'名单（每行一人）','area',roster[role].join('\n'))).join('')+

 panel('交付时效与运营对接',field('shiftIntro','调休与交付说明','area')+field('normalTitle','常规时效标题')+field('urgentTitle','加急时效标题')+field('normalText','常规交付说明','area')+field('urgentText','加急交付说明','area')+
 field('opsLead','运营对接负责人')+field('opsSummary','对接职责')+field('orderFlow','下单与确认','area')+field('deliveryFlow','拍摄与交付','area')+field('feedbackFlow','反馈与复核','area'))+
 panel('产能规划',field('planTitle','页面标题')+field('planIntro','规划说明','area')+field('planNotes','补充安排','area'))+
 '<div class="bar admin-actions"><button class="primary">保存网站设置</button><span id="adminStatus" role="status">'+esc(message)+'</span><span class="spacer"></span><button type="button" id="adminHome">查看首页</button></div></form>';

 document.querySelector('#adminHome').onclick=()=>{tab='home';render()};
 document.querySelector('#adminForm').onsubmit=async e=>{
  e.preventDefault();
  const form=e.currentTarget;
  const fields=new FormData(form);
  const status=document.querySelector('#adminStatus');
  const lines=value=>[...new Set(String(value||'').split(/\r?\n/).map(item=>item.trim()).filter(Boolean))];
  const next={...settings};
  for(const [key,value] of fields)if(typeof value==='string'&&Object.hasOwn(defaults,key)&&!['photo','products','types','gallery'].includes(key))next[key]=value.trim();
  const safeImage=src=>/^https:\/\/[^\s]+$/i.test(src)||/^\.\/[\w./%-]+$/i.test(src);
  next.gallery=String(fields.get('gallery')||'').split(/\r?\n/).filter(line=>line.trim()).map(line=>{
   const [src,...caption]=line.split('|');
   return {src:src.trim(),caption:caption.join('|').trim()};
  });
  if(next.gallery.some(p=>!safeImage(p.src))||next.artwork.split(/\r?\n/).some(src=>src.trim()&&!safeImage(src.trim()))){
   status.textContent='配图和相册地址请填写 HTTPS 地址或以 ./ 开头的站内路径。';return;
  }
  next.products=lines(fields.get('products'));
  next.types=lines(fields.get('types'));
  next.roster=Object.fromEntries(Object.keys(defaultRoster).map(role=>[role,lines(fields.get('roster:'+role))]));
  const names=Object.values(next.roster).flat();
  if(!next.title||!next.homeTitle||!next.leader||!next.opsLead||!next.products.length||!next.types.length){status.textContent='请填写网站名称、首页标题、负责人，并保留至少一个品类和拍摄类型。';return}
  if(new Set(names).size!==names.length){status.textContent='同一姓名请只填写在一个岗位名单中。';return}
  const photo=fields.get('photoUpload');
  if(fields.has('resetPhoto'))next.photo='';
  if(photo?.size){
   if(photo.size>2*1024*1024||!/^image\/(jpeg|png|webp)$/.test(photo.type)){status.textContent='请上传 2 MB 以内的 JPG、PNG 或 WebP 图片。';return}
   try{next.photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(photo)})}
   catch{status.textContent='图片读取失败，请重新选择。';return}
  }
  try{localStorage.setItem(settingsKey,JSON.stringify(next))}catch{status.textContent='保存失败，请检查浏览器存储空间。';return}
  settings=next;
  applySettings();
  if(person&&!staff.some(p=>p.name===person))person='';
  document.querySelector('#siteTitle').textContent=settings.title;
  document.title=settings.title;
  adminView('已保存，页面已应用新设置。');
 };
}
