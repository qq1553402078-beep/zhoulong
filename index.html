(function(){
 var V='35';
 try{
  if(sessionStorage.getItem('__bv')===V)return;
  sessionStorage.setItem('__bv',V);
  if('serviceWorker' in navigator){
   Promise.all([
    caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}),
    navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))})
   ]).then(function(){location.reload()}).catch(function(){});
  }
 }catch(e){}
})();

function save(next,recordUndo=true){

   const before=new Map(tasks.map(task=>[task.id,task]));
   const after=new Map(next.map(task=>[task.id,task]));
   const changed=[...new Set([...before.keys(),...after.keys()])].filter(id=>JSON.stringify(before.get(id))!==JSON.stringify(after.get(id)));
   localStorage.setItem(key,JSON.stringify(next));
   if(changed.length){
    lastScheduleChange=changed.map(id=>({id,before:before.get(id),after:after.get(id)}));
    lastUndoneScheduleChange=undefined;
   }
  }else localStorage.setItem(key,JSON.stringify(next));
  tasks=next;return true;
 }catch{alert('无法保存到浏览器，请检查存储权限或空间。');return false}
}
function replayScheduleChange(redo){
 const change=redo?lastUndoneScheduleChange:lastScheduleChange;
 if(!change)return;
 const expected=redo?'before':'after';
 const result=redo?'after':'before';
 const current=new Map(tasks.map(task=>[task.id,task]));
 if(change.some(entry=>JSON.stringify(current.get(entry.id))!==JSON.stringify(entry[expected]))){
  alert('这次操作涉及的安排已有更新，请核对后手动修改。');return;
 }
 if(!confirm(redo?'重做刚撤销的工作安排修改？':'撤销上一次已保存的工作安排修改？'))return;
 for(const entry of change){
  if(entry[result])current.set(entry.id,entry[result]);else current.delete(entry.id);
 }
 if(save([...current.values()],false)){
  rememberDraftRows();
  lastScheduleChange=redo?change:undefined;
  lastUndoneScheduleChange=redo?undefined:change;
  savedTask=null;render();
  document.querySelector('#scheduleSaved [role="status"]').textContent=redo?'已重做上次修改。':'已撤销上次修改。';
 }
}

 bindScheduleImage({date:draftDate,roster:{...roleNames,lead:activeNames,model:activeNames},products,types,saveRows(rows){
  const pending=[];
  const seen=new Set(tasks.map(t=>JSON.stringify([t.date,t.lead||'',t.model||'',t.handModel||'',t.product||'',t.type||'',t.notes||''])));
  for(const row of rows){
   if(!/^\d{4}-\d{2}-\d{2}$/.test(row.date)||!Number.isFinite(Date.parse(row.date))||new Date(row.date+'T00:00:00Z').toISOString().slice(0,10)!==row.date)return '请选择有效日期。';
   if(!row.product&&!row.type)return '每条任务至少填写一个品类或拍摄类型。';
   for(const role of ['lead','model','handModel']){
    const unknown=members(row[role]).find(name=>!activeNames.includes(name));
    if(unknown)return '名单中找不到「'+unknown+'」，请核对姓名。';
    row[role]=members(row[role]).join('、');
   }
   const task={...row,id:newId(),assigned:row.date+'T09:00',due:plusDay(row.date,1)+'T18:00',title:[row.product,row.type].filter(Boolean).join(' · '),priority:'常规',status:'待拍摄'};

  }

function taskRow(t,index){
 t={...t,assignmentCount:t.assignmentCount??1,acceptanceCount:t.acceptanceCount??1};
 const formId='task-row-'+index;
 const input=(k,label,type='text',attrs='')=>'<input aria-label="'+label+'" form="'+formId+'" name="'+k+'" type="'+type+'" value="'+esc(t[k])+'" '+attrs+'>';
 const select=(k,label,values)=>'<select aria-label="'+label+'" form="'+formId+'" name="'+k+'">'+options(values,t[k]||'').replace('<option selected></option>','<option value="" selected>选择'+label+'</option>').replace('<option ></option>','<option value="">选择'+label+'</option>')+'</select>';
 const availability=readRest();
 const staffSelect=(k,label,names=activeNames)=>{
 const chosen=members(t[k]),isStaff=[...roles,'handModel'].includes(k);
 const specials=isStaff?[...new Set(settings.specialOptions||[])].filter(Boolean):[];
 const specialSet=new Set(specials);
 const roleByName=isStaff?new Map(staff.map(p=>[p.name,p.role])):null;
 const preferred=k==='lead'?new Set([...roster['基础摄影'],...roster['创新组']]):new Set(roleNames[k==='handModel'?'model':k]||[]);
 const ordered=[...new Set([...specials,...names,...chosen])].filter(Boolean);
 if(isStaff)ordered.sort((a,b)=>(specialSet.has(a)?0:1)-(specialSet.has(b)?0:1)||Number(preferred.has(b))-Number(preferred.has(a)));
 const filterRoles=[...new Set([...(specials.length?['特殊']:[]),...staff.map(p=>p.role)])];
 const filter=isStaff?'<select class="staff-role-filter" aria-label="筛选'+label+'候选岗位" onchange="filterStaffOptions(this)"><option value="">全部岗位</option>'+
 options(filterRoles,'')+'</select>':'';
 const placeholder=isStaff?'未选择':'选择'+label;

function equipmentUsage(name,date,excludeId){
 if(!name||!date)return '';
 const parts=tasks.filter(t=>t.id!==excludeId&&t.date===date).map(t=>{
  const used=Array.isArray(t.equipment)?t.equipment:members(t.equipment||'');
  return used.includes(name)?(members(t.lead).join('、')||'摄影师待定')+' · '+(t.product||t.title||'任务'):'';
 }).filter(Boolean);
 return parts.length?'已安排：'+parts.join('；'):'';
}

function staffBookingUsage(name,date,excludeId){

  const roles=BOOK_FIELDS.filter(f=>members(t[f]||'').includes(name)).map(f=>({lead:'摄影',model:'模特',handModel:'手模',assistant:'摄助',retouch:'修片'}[f]||f));
  return roles.length?(roles.join('/')+' · '+(t.product||t.title||'任务')):'';
 }).filter(Boolean);

function equipmentConflict(t){

  if(other.id===t.id||other.date!==t.date)continue;
  const used=Array.isArray(other.equipment)?other.equipment:members(other.equipment||'');
  const overlap=chosen.filter(e=>used.includes(e));

function taskError(t){

   if(!/^\d{4}-\d{2}-\d{2}$/.test(record.date)||!Number.isFinite(Date.parse(record.date+'T00:00:00Z'))||new Date(record.date+'T00:00:00Z').toISOString().slice(0,10)!==record.date||record.date<t.delivery.slice(0,10))return '追加验收日期应为有效日期，且不早于首次交付日期。';

  }
 }
 if(t.due<t.assigned||(t.delivery&&t.delivery<t.assigned))return '交付时间需在运营下发时间之后。';
 if(statuses.slice(3).includes(t.status)&&!t.delivery)return '请展开「工单与交付」，填写首次交付时间。';
 if(done(t)&&(!t.acceptDate||t.accepted===''||t.acceptDate<t.delivery.slice(0,10)))return '请填写验收条数及验收日期，验收日期应为交付当天或之后。';
 if(done(t)&&!roles.some(k=>t[k])&&!t.handModel?.trim())return '请分配参与人员。';

 return '';
}

function parseDelimited(text){
 const separator=text.includes('\t')?'\t':',';
 const rows=[[]];
 let cell='',quoted=false;
 const source=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n')+'\n';
 for(let i=0;i<source.length;i++){
  const char=source[i];
  if(char==='"'){
   if(quoted&&source[i+1]==='"'){cell+='"';i++}else quoted=!quoted;
  }else if(!quoted&&(char===separator||char==='\n')){
   rows.at(-1).push(cell);cell='';
   if(char==='\n')rows.push([]);
  }else cell+=char;
 }
 return rows;
}

 if(!match)return '';
 const date=match[1]+'-'+match[2].padStart(2,'0')+'-'+match[3].padStart(2,'0');
 const stamp=Date.parse(date+'T00:00:00Z');
 return Number.isFinite(stamp)&&new Date(stamp).toISOString().slice(0,10)===date?date:'';
}

async function readRestXlsx(buffer){
 const bytes=new Uint8Array(buffer), view=new DataView(buffer), decoder=new TextDecoder();
 let end=bytes.length-22;
 for(;end>=Math.max(0,bytes.length-65557);end--)if(view.getUint32(end,true)===0x06054b50)break;
 if(end<Math.max(0,bytes.length-65557))throw Error('无法读取此 XLSX 文件。');
 let offset=view.getUint32(end+16,true);
 const entries=new Map();
 for(let i=0;i<view.getUint16(end+10,true);i++){
  const length=view.getUint16(offset+28,true);
  const name=decoder.decode(bytes.subarray(offset+46,offset+46+length));
  entries.set(name,{size:view.getUint32(offset+20,true),method:view.getUint16(offset+10,true),start:view.getUint32(offset+42,true)});
  offset+=46+length+view.getUint16(offset+30,true)+view.getUint16(offset+32,true);
 }
 async function xml(name){
  const entry=entries.get(name);
  if(!entry)return null;
  const start=entry.start+30+view.getUint16(entry.start+26,true)+view.getUint16(entry.start+28,true);
  const data=bytes.subarray(start,start+entry.size);
  const text=entry.method===0?decoder.decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return new DOMParser().parseFromString(text,'application/xml');
 }

 for(const path of entries.keys()){
  if(!/^xl\/worksheets\/sheet\d+\.xml$/.test(path))continue;
  const sheet=await xml(path);
  const rows=[...sheet.getElementsByTagName('row')].map(row=>{
   const values=[];
   for(const cell of row.getElementsByTagName('c')){
    const letters=cell.getAttribute('r')?.match(/^[A-Z]+/)?.[0];
    if(!letters)continue;
    const col=[...letters].reduce((n,c)=>n*26+c.charCodeAt(0)-64,0)-1;
    const value=cell.getElementsByTagName('v')[0]?.textContent||'';
    const kind=cell.getAttribute('t');
    values[col]=kind==='s'?strings[Number(value)]:kind==='inlineStr'?[...cell.getElementsByTagName('t')].map(t=>t.textContent).join(''):value;
   }
   return values;
  });

/* ===== 加权人效当量（HRBP版）：品类系数 × 类型系数相乘，不掺估算的可用率 ===== */
// 品类 → 难度系数：私户1.5 / 个护1.25 / 零食百货1.0
// 注意："山药秘与葛根粉/玉米山药葛根粉"含"秘与"但是零食，必须排除
const PRIVATE_RE=/秘与紧致丹|秘与洗液|LILOO紧致丹|liloo/i;
const CARE_RE=/毛囊炎|二硫化硒|LILIA|lilia/i;          // 个护（第二难）
function categoryWeight(cat){
 const s=String(cat||'');
 if(/葛根粉|玉米/.test(s))return {w:1.0,tier:'零食百货'}; // 葛根粉类优先排除私户
 if(PRIVATE_RE.test(s))return {w:1.5,tier:'私户'};
 if(CARE_RE.test(s))return {w:1.25,tier:'个护'};
 return {w:1.0,tier:'零食百货'};
}
// 拍摄类型 → 基础难度系数（口播4.5，其余日产出反推，基准产品展示=1.0）
const DIFFICULTY_RULES=[
 [/意识流/,1.77,'难'],[/口播/,4.5,'难'],
 [/使用展示|使用演示|使用场景|美好展示|痛点展示/,1.53,'中'],
 [/产品.?内料/,1.28,'中'],
 [/内料|成分/,1.77,'中'],
 [/产品展示|产品/,1.0,'简']
];
function typeWeight(label,category){
 const s=String(label||''),c=String(category||'');
 for(const [re,w,level] of DIFFICULTY_RULES){
  if(!re.test(s))continue;
  let final=w;
  // 品类细分特例
  if(/口播/.test(s)&&w===4.5){/* 口播统一4.5 */}
  if(/内料|成分/.test(s)){
   if(CARE_RE.test(c))final=1.77;       // 个护内料：擦拭清洗复杂→难
   else if(!PRIVATE_RE.test(c)&&!CARE_RE.test(c))final=1.0; // 零食内料(冲玉米糊)→简单
  }
  if(/美好展示|使用展示|使用演示|使用场景/.test(s)&&CARE_RE.test(c))final=1.77; // 个护人物美好(洗头冲头)→难
  return {w:final,level:final>=1.77?'难':(final>=1.2?'中':'简'),label:s};
 }
 return {w:1.0,level:'简',label:s||'未分类'};
}
// 创新组分项 → 当量系数（成片/脚本/带教/AI素材/分镜）
const INNOVATION_WEIGHTS=[[/完整视频|成片|创新视频/,8.5],[/拆脚本|裂变脚本|脚本拆解|脚本/,3],[/带教/,4],[/AI素材|素材生成/,0.6],[/分镜/,0.4]];
function innovationWeight(kind){
 const s=String(kind||'');
 for(const [re,w] of INNOVATION_WEIGHTS){if(re.test(s))return w;}
 return 1.0;
}

   });
   continue;
  }

  const cat=t.product||'';
  const tw=typeWeight(members(t.type).join('、'),cat),cw=categoryWeight(cat);

  if(isModel&&/口播/.test(String(t.type||'')))w*=1.5;

// 同组内等级：相对组内中位数/均值，S≥1.3 A≥1.1 B≥0.9 C≥0.7 D<0.7
function gradeOf(value,groupAvg){
 if(!(value>0)||!(groupAvg>0))return null;
 const r=value/groupAvg;
 return r>=1.3?'S':r>=1.1?'A':r>=0.9?'B':r>=0.7?'C':'D';
}

async function compressSharedImage(file){
 if(!/^image\/(jpeg|png|webp)$/i.test(file.type))throw Error('仅支持 JPG、PNG 或 WebP 图片。');
 if(file.size>12*1024*1024)throw Error('单张原图请控制在 12 MB 以内。');
 const bitmap=await createImageBitmap(file);
 let longest=Math.max(bitmap.width,bitmap.height);
 let scale=Math.min(1,1600/longest);
 for(const quality of [.84,.76,.68]){
  const width=Math.max(1,Math.round(bitmap.width*scale));
  const height=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  canvas.getContext('2d').drawImage(bitmap,0,0,width,height);
  const src=canvas.toDataURL('image/webp',quality);
  if(src.length<=650000){bitmap.close?.();return {src,caption:file.name.replace(/\.[^.]+$/,'')};}
  scale*=.8;
 }
 bitmap.close?.();throw Error('图片压缩后仍过大，请换一张更小的图片。');
}

   status.textContent='配图和相册地址请填写 HTTPS 地址或以 ./ 开头的站内路径。';return;

document.addEventListener('change',e=>{
 // 拍摄设备勾选变化：实时显示同日撞档提示
 const eq=e.target.closest?.('input[name="equipment"]');
 if(eq){
  const row=eq.closest('[data-equipment-row]');
  const box=row?.querySelector('[data-equipment-conflict]');
  if(row&&box){
   const form=eq.form;const dateInput=form?.elements?.namedItem('date');
   const chosen=[...(form?.querySelectorAll('input[name="equipment"]:checked')||[])].map(c=>c.value);
   const conflict=equipmentConflict({id:form?.dataset.rowForm||'',date:dateInput?.value||'',equipment:chosen});
   box.textContent=conflict?'⚠ '+conflict:'';
   box.style.color=conflict?'#f0b429':'';
   row.classList.toggle('has-conflict',!!conflict);
  }
 }
 // 数量类型下拉：显示对应隐藏 chip
 const sel=e.target.closest?.('.shot-add-select');
 if(sel){
  const kind=sel.value,scope=sel.dataset.scope;
  if(kind&&scope){
   (shotInputChosen[scope]??=new Set()).add(kind);
   const wrap=sel.closest('.shot-inputs');
   const chip=[...(wrap?.querySelectorAll('.chip-shot')||[])].find(c=>c.dataset.kind===kind);
   if(chip)chip.removeAttribute('data-fold-empty');
   const opt=sel.querySelector('option[value="'+CSS.escape(kind)+'"]');if(opt)opt.remove();
   sel.value='';
   if(!sel.querySelector('option[value]:not([value=""])'))sel.style.display='none';
  }
  return;
 }
 // 交付类型下拉：勾选对应 checkbox 并显示
 const dsel=e.target.closest?.('.dlv-add-select');
 if(dsel){
  const kind=dsel.value,scope=dsel.dataset.scope;
  if(kind&&scope){
   const wrap=dsel.closest('.dlv-wrap');
   const chip=[...(wrap?.querySelectorAll('[data-dlv-chip]')||[])].find(c=>c.dataset.kind===kind);
   if(chip){const cb=chip.querySelector('input[type=checkbox]');if(cb){cb.checked=true;linkDlvToShot(cb)}chip.removeAttribute('data-fold-empty')}
   const opt=dsel.querySelector('option[value="'+CSS.escape(kind)+'"]');if(opt)opt.remove();
   dsel.value='';
   if(!dsel.querySelector('option[value]:not([value=""])'))dsel.style.display='none';
  }
 }
 // 交付类型 checkbox 变化：勾选→联动数量区出现对应输入框；取消→收起并加回下拉
 const cb=e.target.closest?.('[data-dlv-chip] input[type=checkbox]');
 if(cb){
  linkDlvToShot(cb);
  const chip=cb.closest('[data-dlv-chip]');const kind=chip?.dataset.kind;
  if(!cb.checked){
   if(chip)chip.setAttribute('data-fold-empty','1');
   const wrap=chip?.closest('.dlv-wrap');
   if(wrap&&kind){
    let dsel=wrap.querySelector('.dlv-add-select');
    if(!dsel){
     dsel=document.createElement('select');dsel.className='dlv-add-select';dsel.dataset.scope=wrap.dataset.dlvScope||'';
     dsel.style.cssText='width:auto;min-width:120px;padding:5px 8px;font-size:12px';
     dsel.innerHTML='<option value="">＋ 添加类型</option>';wrap.appendChild(dsel);
    }
    dsel.style.display='';
    if(![...dsel.options].some(o=>o.value===kind)){const opt=document.createElement('option');opt.value=kind;opt.textContent=kind;dsel.appendChild(opt)}
   }
  }
 }
});
document.addEventListener('click',e=>{
 const fb=e.target.closest?.('[data-fold-toggle]');
 if(fb){const area=fb.dataset.foldToggle;foldSet(area,!foldState[area]);return}
 const btn=e.target.closest?.('[data-remove-shot]');
 if(!btn)return;
 const kind=btn.dataset.removeShot,scope=btn.dataset.scope,prefix=btn.dataset.prefix;
 if(shotInputChosen[scope])shotInputChosen[scope].delete(kind);
 const wrap=btn.closest('.shot-inputs');
 const chip=btn.closest('.chip-shot');
 if(chip){const inp=chip.querySelector('input[type=number]');if(inp)inp.value='';chip.setAttribute('data-fold-empty','1')}
 if(wrap){
  let sel=wrap.querySelector('.shot-add-select');
  if(!sel&&prefix){
   sel=document.createElement('select');
   sel.className='shot-add-select';sel.dataset.scope=scope;sel.dataset.prefix=prefix;
   sel.style.cssText='width:auto;min-width:120px;padding:5px 8px;font-size:12px';
   sel.innerHTML='<option value="">＋ 添加类型</option>';
   wrap.appendChild(sel);
  }
  if(sel){
   sel.style.display='';
   if(![...sel.options].some(o=>o.value===kind)){
    const opt=document.createElement('option');opt.value=kind;opt.textContent=kind;sel.appendChild(opt);
   }
  }
 }
});
let teamRefreshPending=false;
function isEditingNow(){
 const a=document.activeElement;
 return !!(a&&a!==document.body&&a.matches&&a.matches('input,textarea,select,[contenteditable],[contenteditable="plaintext-only"]'));
}
function renderPreserving(){
 const y=window.scrollY;
 // 记录展开的 details：优先用 data 标识，否则用 summary 文本
 const openKeys=[...main.querySelectorAll('details[open]')].map(d=>{
  const key=d.dataset.dailyTaskCard||d.dataset.dailyTask||d.dataset.taskCard;
  const sum=d.querySelector(':scope > summary')?.textContent?.trim()||'';
  return {key,sum};
 });
 render();
 try{window.scrollTo({top:y,behavior:'instant'})}catch{}
 try{
  main.querySelectorAll('details').forEach(d=>{
   const key=d.dataset.dailyTaskCard||d.dataset.dailyTask||d.dataset.taskCard;
   const sum=d.querySelector(':scope > summary')?.textContent?.trim()||'';
   const match=openKeys.find(o=>(key&&o.key===key)||(!key&&o.sum&&sum&&o.sum.replace(/\s*\d+ 条/,'')===sum.replace(/\s*\d+ 条/,'')));
   if(match)d.open=true;
  });
 }catch{}
}
function doTeamRefresh(){
 if(tab==='schedule')rememberDraftRows();
 try{tasks=JSON.parse(localStorage.getItem(key)||'[]')}catch{}
 try{settings={...defaults,...JSON.parse(localStorage.getItem(settingsKey)||'{}')};applySettings();refreshManagedOptions()}catch{}
 // 正在输入时不重建 DOM，避免光标丢失/页面跳动/输入被打断；标记待刷新，失焦后补刷
 if(isEditingNow()){teamRefreshPending=true;return}
 renderPreserving();
}
window.addEventListener('studio-team-refresh',doTeamRefresh);
// 编辑结束（失焦）后，若期间有团队更新，补一次刷新
document.addEventListener('focusout',()=>{
 if(!teamRefreshPending)return;
 setTimeout(()=>{if(!isEditingNow()){teamRefreshPending=false;renderPreserving()}},150);
});

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});

(function(){
  var deferred=null;
  var isIOS=/iPad|iPhone|iPod/i.test(navigator.userAgent);
  function showBar(text,onInstall){
    if(document.getElementById('pwa-install-bar'))return;
    var el=document.createElement('div');
    el.id='pwa-install-bar';
    el.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;display:flex;align-items:center;gap:10px;max-width:94vw;padding:9px 12px;border-radius:12px;background:#14223b;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);font:13px system-ui';
    var s=document.createElement('span');s.textContent=text;el.appendChild(s);
    if(onInstall){
      var b=document.createElement('button');b.textContent='安装';
      b.style.cssText='border:0;border-radius:8px;padding:7px 12px;background:#2855d9;color:#fff;cursor:pointer;white-space:nowrap';
      b.onclick=onInstall;el.appendChild(b);
    }
    var x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','关闭');
    x.style.cssText='border:0;background:transparent;color:#cbd5e1;cursor:pointer;font-size:18px;line-height:1;padding:0 2px';
    x.onclick=function(){el.remove()};el.appendChild(x);
    document.body.appendChild(el);
  }
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();deferred=e;
    showBar('把它装到手机桌面，像 APP 一样打开',function(){
      deferred.prompt();
      deferred.userChoice.then(function(){
        var bar=document.getElementById('pwa-install-bar');if(bar)bar.remove();
        deferred=null;
      });
    });
  });
  if(isIOS && !navigator.standalone){
    setTimeout(function(){
      showBar('iPhone 安装：点底部「分享」→「添加到主屏幕」',null);
    },2500);
  }
})();
</script>
<script>
// 当日拍摄明细：增删行 + 实时合计（事件委托，render 重建后仍有效）
(function(){
 var bdUpdate=function(box){
  if(!box)return;
  var sum=0,urgentSum=0;
  box.querySelectorAll('.bd-row').forEach(function(row){
   var n=Number(row.querySelector('.bd-count')?.value)||0;
   sum+=n;
   if(row.querySelector('.bd-urgent input')?.checked)urgentSum+=n;
  });
  var net=Math.max(0,sum-urgentSum);
  var el=box.querySelector('[data-bd-total]');
  if(el)el.textContent=sum>0?('明细共 '+sum+' 条'+(urgentSum>0?'（含加急 '+urgentSum+' 条）':'')+' · 正常 '+net+' 条（参考）'):'';
  var note=box.querySelector('.bd-head-note');
  if(note){
   var parts=[];
   box.querySelectorAll('.bd-row').forEach(function(row){
    var cat=(row.querySelector('.bd-category')?.value||'').trim();
    var typ=(row.querySelector('.bd-type')?.value||'').trim();
    var cnt=row.querySelector('.bd-count')?.value||'';
    var urgent=!!row.querySelector('.bd-urgent input')?.checked;
    if(cat||typ||String(cnt).trim()!=='')parts.push((urgent?'⚡':'')+(cat?cat+(typ?'·':''):'')+(typ||(cat?'':'未命名'))+' '+cnt+'条');
   });
   note.textContent=parts.length?parts.join('、'):'如有临时加急素材，可在此处填写 →';
  }
 };
 document.addEventListener('input',function(e){
  if(e.target.classList&&(e.target.classList.contains('bd-count')||e.target.classList.contains('bd-type')||e.target.classList.contains('bd-category')))bdUpdate(e.target.closest('.daily-breakdown'));
 });
 document.addEventListener('change',function(e){
  if(e.target.classList&&(e.target.classList.contains('bd-count')||e.target.classList.contains('bd-type')||e.target.classList.contains('bd-category')||e.target.classList.contains('bd-urgent')))bdUpdate(e.target.closest('.daily-breakdown'));
 });
 document.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest&&t.closest('.bd-add')){
   var box=t.closest('.daily-breakdown'),rows=box.querySelector('.bd-rows'),first=rows.querySelector('.bd-row');
   if(first){var c=first.cloneNode(true);c.querySelectorAll('input').forEach(function(i){if(i.type==='checkbox')i.checked=false;else i.value=''});rows.appendChild(c)}
   bdUpdate(box);return;
  }
  if(t.closest&&t.closest('.bd-del')){
   var row=t.closest('.bd-row'),box2=row.closest('.daily-breakdown'),rows2=box2.querySelector('.bd-rows');
   if(rows2.querySelectorAll('.bd-row').length>1)row.remove();
   else row.querySelectorAll('input').forEach(function(i){if(i.type==='checkbox')i.checked=false;else i.value=''});
   bdUpdate(box2);return;
  }
 });
})();
</script></html>
